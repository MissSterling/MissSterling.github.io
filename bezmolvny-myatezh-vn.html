<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Безмолвный мятежник — визуальная новелла</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--ink:#120e17;--plum:#2a1a34;--bone:#efe6e1;--rib:#fff;--blood:#b3263f;--steel:#7d97b3;--dim:#a89aa8;color-scheme:dark;
--serif:'Cormorant Garamond',Georgia,serif;--disp:'Forum',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);font-family:var(--serif);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage{flex:1;position:relative;overflow:hidden;transition:background 1.2s}
.bg-room{background:radial-gradient(ellipse at 70% 20%,#5a3347 0,#2a1a34 45%,#120e17 100%)}
.bg-mirror{background:radial-gradient(ellipse at 50% 30%,#4b3a52 0,#241a2b 50%,#0e0b13 100%)}
.bg-house{background:linear-gradient(#0b1020,#16223a 60%,#0b0f1a)}
.bg-road{background:linear-gradient(#070a14,#1b1230 70%,#2b1030)}
.bg-door{background:linear-gradient(90deg,#0f1b20,#2b4b55 50%,#0f1b20)}
.bg-bed{background:radial-gradient(ellipse at 50% 80%,#3a2530 0,#1b1219 60%,#0c080d)}
.bg-end{background:radial-gradient(ellipse at 50% 100%,#6a1426 0,#1a0c16 55%,#0a070c)}
#art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}#art.on{opacity:1}#art.dim{opacity:.38}#shade{position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(14,10,19,.8))}
#road{position:absolute;left:0;right:0;bottom:0;height:34%;display:none;background:repeating-linear-gradient(90deg,transparent 0 46%,#d9cfd6 46% 54%,transparent 54% 100%);background-size:100% 100%;mask:linear-gradient(transparent,#000);opacity:.35;animation:rd 1.1s linear infinite}
.ride #road{display:block}
@keyframes rd{to{background-position:0 160px}}
#card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;gap:14px}
#title{font:400 clamp(34px,9vw,60px)/1.05 var(--disp);letter-spacing:.01em}
#sub{color:var(--dim);font-style:italic;font-size:19px}
#warn{max-width:30ch;color:var(--dim);font-size:16px;line-height:1.35}
.btn{font:600 20px var(--serif);color:var(--bone);background:transparent;border:1px solid var(--bone);border-radius:2px;padding:13px 22px;min-height:48px;cursor:pointer}
.btn:focus-visible{outline:2px solid var(--steel);outline-offset:3px}
.btn.fill{background:var(--blood);border-color:var(--blood)}
#box{position:relative;margin:0 12px 12px;padding:16px 18px 18px;background:rgba(14,10,19,.9);border-top:2px solid var(--rib);min-height:168px;max-height:48%;overflow:auto;cursor:pointer}
#who{font:400 19px var(--disp);margin-bottom:6px;color:var(--rib)}
#who.kai{color:#8fd0a8}#who.nil{color:#ff9d8a}#who.nar{color:var(--dim);font-style:italic;font-family:var(--serif)}
#txt{font-size:21px;line-height:1.38;white-space:pre-wrap}
#tip{position:absolute;right:14px;bottom:8px;color:var(--dim);font-size:15px}
#ch{display:flex;flex-direction:column;gap:9px;margin-top:12px}
#ch .btn{text-align:left;font-size:19px}
#bar{position:absolute;top:8px;right:10px;display:flex;gap:8px;z-index:3}
#bar button{background:rgba(0,0,0,.4);border:1px solid #fff4;color:var(--bone);font:16px var(--serif);padding:6px 10px;border-radius:2px;min-height:36px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#road{animation:none}#stage{transition:none}}
</style>
</head>
<body>
<div id="app">
 <div id="stage" class="bg-room">
  <img id="art" alt=""><div id="shade"></div>
  <div id="road"></div>
  <div id="bar" hidden><button id="mn" aria-label="В меню">Меню</button></div>
  <div id="card">
   <div id="title">Безмолвный мятежник</div>
   <div id="sub">Глава 1 · по роману Милены Янг</div>
   <div id="warn">Тёмная история для взрослых: насилие, суицидальные мысли, детские травмы. Здесь всё показано без подробностей.</div>
   <button class="btn fill" id="go">Начать</button>
   <button class="btn" id="ct" hidden>Продолжить</button>
  </div>
 </div>
 <div id="box" hidden role="button" tabindex="0" aria-live="polite">
  <div id="who"></div><div id="txt"></div><div id="ch"></div><span id="tip">коснись, чтобы продолжить</span>
 </div>
</div>
<script>
// ---------- Сценарий (пересказ своими словами) ----------
// n = рассказчик, N = Нильде, K = Кай. Строка: [кто, текст]. Конец сцены: next или ch (выборы).
const W={n:['',''],N:['Нильде','nil'],K:['Кай','kai']};
const S={
start:{bg:'room',l:[
['n','Конец августа. Особняк братства спит. Нильде Йохансен собирает рюкзак для вылазки, о которой не знает никто.'],
['n','Фонарик. Шокер. И любимый M1911: отец учил её стрелять, как солдата, и она ни разу не подвела его науку.'],
['n','Дамиан Йохансен для мира — герой ФБР и безупречный адвокат. Для семьи — ещё и босс итальянской мафии, который отказывался от трона ради них и всё равно вернулся.'],
['N','Мы с папой так похожи.'],
['n','Но сегодня дело не в отце. В зеркале ей отвечает чужой, злой внутренний голос.'],
['n','«Если бы ты была внимательнее… Если бы рассказала родителям… Это твоя вина».']],
ch:[['Заткнуть голос: «Это не моя вина»','mirror','tough'],['Промолчать и закончить сборы','mirror','quiet']]},
mirror:{bg:'mirror',l:[
['N',null],
['n','Она вытирает расплывшуюся тушь. Хорошие девочки не плачут: они улыбаются и хлопают ресницами, как фарфоровые куклы.'],
['N','Какая жалость, что я не хорошая.'],
['n','Готический корсет, чёрное кружево, белые атласные ленты в рыжих волосах, тяжёлые ботинки. Ядовито и красиво. Под платьем — нож.'],
['N','Ради тебя, братик. Я принесу их головы к твоим ногам.']],next:'house'},
house:{bg:'house',art:'reap',l:[
['n','Дом Жнецов — три этажа стекла и камня, лучшая охрана в Тармонде. Здесь живут пятеро лидеров братства, и все они вырастили Нильде.'],
['n','Вильям, рисующий кровью, сейчас сидит в тюрьме. Дэниел, холодный как лёд. Риз, влюблённый в своё отражение. Николай, русский боксёр, её «Ни», который уехал, не попрощавшись.'],
['n','И Кай. Её щит, её громоотвод, её старший брат.'],
['n','Она проскальзывает мимо охраны и заводит красный «Харлей».']],next:'road'},
road:{bg:'road',cls:'ride',l:[
['n','Дорога пуста. Подол платья бьётся на ветру, огни города смазываются в полосы.'],
['n','В голове крутится одна и та же фраза брата: «Прости, что подвёл тебя, сестрёнка».'],
['n','Всё началось не сегодня. Четыре года назад.']],next:'door'},
door:{bg:'door',l:[
['n','15 октября. Нильде четырнадцать. Кай вернулся под утро, но из его ванной уже полчаса льётся вода.'],
['N','Кай? Ты там долго.'],
['K','Уходи.'],
['n','Голос ломаный, как несмазанная дверь. Нильде никогда не слышала от него такого.']],
ch:[['Колотить в дверь, пока не откроет','open1','push'],['Пригрозить, что позовёт маму','open1','mom']]},
open1:{bg:'door',l:[
['n','Щелчок замка.'],
['n','Он стоит мокрый, с потухшими глазами. Будто вместо Кая вышел кто-то с его лицом. На запястьях и шее синяки, на коже глубокие царапины.'],
['n','Нильде не знает, что с ним сделали, и не решается спросить. Она просто кидается ему на шею.'],
['N','Только не делай с собой ничего. Прошу.']],next:'bed'},
bed:{bg:'bed',l:[
['K','Я не хотел, чтобы ты это видела.'],
['K','Если я скажу вслух, это станет правдой. Я не вынесу. Не рассказывай никому: ни маме, ни папе, ни Николаю.'],
['n','Нильде слышит, как гулко бьётся её больное сердце.']],
ch:[['«Обещаю, но и ты поклянись, что не бросишь меня»','swear','swear'],['«Но им можно помочь…»','swear','ask']]},
swear:{bg:'bed',l:[
['K','Я никогда себе не наврежу, Нильде. Клянусь.'],
['n','Он обнимает её крепче. Ей кажется, что клятва держит их обоих.'],
['n','Она не видит, как по его затылку стекает кровь: в душе он бил головой о стену, пытаясь стереть случившееся.'],
['n','Через четыре года она найдёт его в луже собственной крови.']],next:'ride2'},
ride2:{bg:'road',art:'mut',cls:'ride',l:[
['n','Мотоцикл выносит её к границе кампусов. Туман, шпили, чёрный камень Красной Лощины.'],
['n','Там живут Мятежники: маски зверей и кукол, игры, которые отнимают людей. Один из них когда-то был её лучшим другом.'],
['N','Нельзя думать о нём.'],
['n','Арден. Тот, кто не остановился, когда она просила.'],
['n','Её хрупкая спина вжимается в бак. Фонарик, шокер, пистолет. Сегодня она переступит черту.']],next:'end'},
end:{bg:'end',art:'duo',l:[
['n','Конец первой главы. Дальше: Красная Лощина, Мия Гото и встреча, которой Нильде боится больше всего.']],end:1}
};

function setArt(k,dim){const a=$('art');if(k){if(a.dataset.k!==k){a.src=ART[k];a.dataset.k=k;a.style.objectPosition=POS[k]}a.className='on'+(dim?' dim':'')}else a.className=''}
const $=i=>document.getElementById(i);let st={s:'start',i:0,f:{}},typing=0,full='',timer;
function save(){try{localStorage.setItem('vn1',JSON.stringify(st))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('vn1'))}catch(e){return null}}
function show(s,i){st.s=s;st.i=i;save();const sc=S[s];setArt(sc.art);$('stage').className='bg-'+sc.bg+(sc.cls?' '+sc.cls:'');
 const l=sc.l[i];let [w,t]=l;
 if(t===null){t=st.f.tough?'Заткнись. Это не моя вина. И я всё исправлю.':'Я просто сделаю то, что должна.'}
 const [nm,cl]=W[w];$('who').textContent=nm;$('who').className=cl||'nar';
 $('ch').innerHTML='';type(t)}
function type(t){clearInterval(timer);full=t;let k=0;typing=1;$('txt').textContent='';$('tip').hidden=1;
 timer=setInterval(()=>{k+=2;$('txt').textContent=full.slice(0,k);if(k>=full.length)done()},22)}
function done(){clearInterval(timer);typing=0;$('txt').textContent=full;const sc=S[st.s];
 if(st.i===sc.l.length-1&&sc.ch){sc.ch.forEach(([lab,to,fl])=>{const b=document.createElement('button');b.className='btn';b.textContent=lab;
  b.onclick=e=>{e.stopPropagation();st.f[fl]=1;show(to,0)};$('ch').appendChild(b)})}
 else if(sc.end){$('tip').hidden=1;const b=document.createElement('button');b.className='btn fill';b.textContent='В начало';b.onclick=e=>{e.stopPropagation();st={s:'start',i:0,f:{}};save();menu()};$('ch').appendChild(b)}
 else $('tip').hidden=0}
function step(){if(typing){done();return}const sc=S[st.s];if(sc.ch&&st.i===sc.l.length-1)return;if(sc.end)return;
 if(st.i<sc.l.length-1)show(st.s,st.i+1);else show(sc.next,0)}
function menu(){$('card').hidden=0;$('box').hidden=1;$('bar').hidden=1;$('stage').className='bg-room';setArt('duo',1);$('ct').hidden=!(load()&&load().s!=='start'||load()&&load().i>0)}
function play(from){$('card').hidden=1;$('box').hidden=0;$('bar').hidden=0;show(from.s,from.i)}
$('go').onclick=()=>{st={s:'start',i:0,f:{}};play(st)};
$('ct').onclick=()=>{const v=load();if(v){st=v;play(v)}};
$('mn').onclick=menu;$('box').onclick=step;
$('box').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();step()}};
menu();
</script>
